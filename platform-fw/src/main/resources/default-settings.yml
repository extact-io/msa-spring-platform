env:
  otlp:
    enabled: false
    endpoint:
      scheme: http
      host: localhost
      port-rest: 4318
      port-grpc: 4317

spring:
  mvc:
    format:
      date: yyyyMMdd
      date-time: yyyyMMdd HH:mm
  threads:
    virtual:
      enabled: true
      
management:
  endpoints:
    enabled-by-default: false
    jmx:
      exposure:
        exclude: "*"
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      enabled: true
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db,dependentServers"
      validate-group-membership: false # groupにindicatorが存在しない場合もエラーにしない設定
      
  # =======
  # ＜TelemetryパイプラインはOTEL+HTTPの標準的な構成＞
  # metrics(micrometer-registry-otlp) ------------(HTTP)--┐                ┌-- (http://prometheus:9090/api/v1/otlp) -> Prometheus/otlp-receiver
  # tracing(micrometer-tracing-bridge-otel) ------(gRPC)--├--> collector --┤-- (http://tempo:4418) ------------------> Grafana Tempo
  # logging(opentelemetry-logback-appender-1.0) --(gRPC)--┘                └-- (http://loki:3100/otlp) --------------> Grafana Loki
  # =======
  metrics:
    tags:
      application: ${spring.application.name}
      instance: host.docker.internal:${server.port}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0  # 100%サンプリング（開発環境向け）
  otlp:
    metrics:
      export:
        enabled: ${env.otlp.enabled}
        url: ${env.otlp.endpoint.scheme}://${env.otlp.endpoint.host}:${env.otlp.endpoint.port-rest}/v1/metrics # MicrometerはgRPCは未サポート
        step: 2s
    tracing:
      export:
        enabled: ${env.otlp.enabled}
      transport: grpc
      endpoint: ${env.otlp.endpoint.scheme}://${env.otlp.endpoint.host}:${env.otlp.endpoint.port-grpc} # for gRPC
    logging:
      export:
        enabled: ${env.otlp.enabled}
      transport: grpc
      endpoint: ${env.otlp.endpoint.scheme}://${env.otlp.endpoint.host}:${env.otlp.endpoint.port-grpc} # for gRPC

rms:
  log:
    access:
      enable: true
      type: rms
      rms-option:
        layout-pattern: "%h %l %u %r %t{yyyy-MM-dd HH:mm:ss.SSS} %s %b %D ms" 
  datasource: # デフォルトはurlを登録してないのでin-memory dbが使われる
    fw:
      generate-unique-name: false
      name: framework-datasource
      hikari:
        maximum-pool-size: 10
      sql:
        mode: ALWAYS
        schema-locations: classpath:sql/login-user-attributes-schema.sql
        data-locations: classpath:sql/login-user-attributes-data.sql
    applicaiton: # JPAの設定はspring.jpa.*をもとに行われる
      generate-unique-name: false
      name: applicaiton-datasource
      hikari:
        maximum-pool-size: 10
  login-user-attributes:
    cache:
      enabled: true
      type: caffeine
      caffeine:
        cache-null-values: true
        spec: "maximumSize=100,expireAfterAccess=1s"
      redis:
        cache-null-values: true
        enable-statistics: false
        time-to-idle: 10m
  rest:
    controller:
      format:
        date: ${spring.mvc.format.date}
        date-time: ${spring.mvc.format.date-time}
