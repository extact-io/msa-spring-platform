debug: false
logging.level:
  org.springframework:
    transaction: info
    security: info
  ConfigDump: debug

spring:
  main:
    banner-mode: off
  messages:
    basename: fw-messages,test-fw-messages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      javax.persistence.validation.mode: NONE

rms:
  log:
    server:
      enable: false
  debug:
    configdump:
      enable: false # change to true in the test class
      #system-properties: true
      #system-environment: true
    sleep:
      enable: false # change to true in the test class
      time: 1s
  health:
    depend-services:
      - http://localhost:7002/actuator/health/readiness
      - http://localhost:7003/actuator/health/readiness
      - http://localhost:7004/actuator/health/readiness
  jwt-encode:
    enable: true
    private-key: classpath:/jwt.key
    clock:
      type: SYSTEM
      fixed-datetime: 2024-01-01T12:30 # typeがSYSTEMの場合は無視される
    claim:
      issuer: JsonWebTokenIntegrationTest
      exp: 60                 # 有効期限（分単位）
  jwt-deencode:
    public-key: classpath:/jwt.pub.key
    claim:
      issuer: ${rms.jwt-encode.claim.issuer}
  persistence:
    person:
      csv:
        type: temporary
        temporary:
          resource: temporary/personTemp.csv
      sql:
        schema-locations: classpath:sql/person-schema.sql
        data-locations: classpath:sql/person-data.sql
      remote:
        url: http://localhost:${local.server.port}
        format:
          date: ${spring.mvc.format.date}
          date-time: ${spring.mvc.format.date-time}
  rest:
    controller:
      format:
        date: ${spring.mvc.format.date} # for DefaultSettingsTest override
---
spring:
  config:
    activate:
      on-profile: "env-import-test"
    import: classpath:env-test/application-import.yml
