debug: false
logging.level:
  org.springframework:
    transaction: info
    security: trace
  ConfigDump: debug

spring:
  main:
    banner-mode: off
  messages:
    basename: application-messages,test-application-messages
    encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: "env,beans"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db,dependentServers"
      validate-group-membership: false # groupにindicatorが存在しない場合もエラーにしない設定

#rms.persistence.entity: person
#rms.persistence.person.apiType.: jpa
#rms.persistence.person.csv.type: temporary
#rms.persistence.person.csv.permanent.directory: ./data
#rms.persistence.person.csv.permanent.filename: person.csv
#rms.persistence.person.csv.temporary.resource: temporary/personTemp.csv

rms:
  persistence:
    entity: person
  debug:
    configdump:
      enable: false # change to true in the test class
      #system-properties: on
      #system-environment: on
    sleep:
      enable: false # change to true in the test class
      time: 1s
  health:
    depend-services:
      - http://localhost:7002/actuator/health/readiness
      - http://localhost:7003/actuator/health/readiness
      - http://localhost:7004/actuator/health/readiness
  auth:
    multi: false
  jwt-provider:
    enable: true
    private-key: classpath:/jwt.key
    clock:
      type: SYSTEM
      fixed-datetime: 2024-01-01T12:30 # typeがSYSTEMの場合は無視される
    claim:
      issuer: JsonWebTokenIntegrationTest
      exp: 60                 # 有効期限（分単位）
  jwt-validator:
    public-key: classpath:/jwt.pub.key
    claim:
      issuer: ${rms.jwt-provider.claim.issuer}
